name: Android CI

on:
  push:
    branches:
      - main
      - work/sonix-vip-development
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and test Android app
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Verify Gradle installation
        run: gradle --version

      - name: Validate bundled IPTV JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          html = Path("app/src/main/assets/sonix_tv.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\\s[^>]*)?>(.*?)</script>", html, flags=re.IGNORECASE | re.DOTALL)
          inline_scripts = [script for script in scripts if script.strip()]
          if not inline_scripts:
              raise SystemExit("No inline IPTV application script was found")
          Path("/tmp/sonix-tv-inline.js").write_text("\\n".join(inline_scripts), encoding="utf-8")
          PY
          node --check /tmp/sonix-tv-inline.js

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Generate CI debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SONIX-VIP-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
